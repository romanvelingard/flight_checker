name: Flight Deals Scanner

on:
  schedule:
    # Run daily at 06:00 UTC (9:00 AM Israel Time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore price history cache
        uses: actions/cache@v4
        with:
          path: .price_history.json
          key: price-history-${{ github.run_id }}
          restore-keys: |
            price-history-

      - name: Run Flight Deals Scanner
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          python flight_deals.py
          mkdir -p dist
          cp deals_report.html dist/index.html
          cp deals_report.html dist/deals_report.html
          cp deals.csv dist/deals.csv

      - name: Upload Build Artifacts (HTML & CSV)
        uses: actions/upload-artifact@v4
        with:
          name: flight-deals-report
          path: |
            dist/deals_report.html
            dist/deals.csv

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
